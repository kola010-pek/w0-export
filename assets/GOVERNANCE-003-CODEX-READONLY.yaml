task_id: GOVERNANCE-003-CODEX-READONLY
title: "固化Codex只读监理边界与职责分离门禁"
policy_version_from: 1.0.0
policy_version_to: 1.1.0
status: APPROVED_FOR_CONSTRUCTION

owner: 平台负责人
builder: 扣子编程
inspector: Codex

role_contract:
  builder_role: coze-builder
  inspector_role: codex-inspector
  inspector_mode: read_only
  inspector_write_allowed: false
  builder_must_not_equal_inspector: true

objective: >
  删除现行规则中“任务单授权后Codex可修改交付文件”的例外，
  将Codex永久默认角色固化为只读监理；普通自然语言不得触发角色切换；
  增加施工与验收主体分离、写操作前角色检查和任务合同冲突门禁。

authorized_files:
  - GOVERNANCE.md
  - AGENTS.md
  - tasks/TASK_TEMPLATE.yaml
  - evidence/GOVERNANCE-003-CODEX-READONLY/*

forbidden_files:
  - "src/**"
  - "tests/**"
  - "config/**"
  - package.json
  - pnpm-lock.yaml
  - "runtime/**"
  - "adapters/**"
  - "database/**"

forbidden_actions:
  - modify_business_source
  - modify_tests
  - modify_runtime_configuration
  - install_or_upgrade_dependencies
  - connect_or_scan_real_database
  - production_write
  - deployment
  - role_self_approval

required_changes:
  governance_md:
    - "将policy_version从1.0.0提升到1.1.0"
    - "删除Codex在任务单授权后可承担修复/施工的例外"
    - "增加separation_of_duties_gate：builder不得等于inspector"
    - "增加inspector不得修改deliverables"
    - "增加self_check不得称为independent_acceptance"
    - "增加普通指令执行/继续/修复/落实/应用不得触发Codex角色切换"
    - "增加ROLE_SWITCH_CODEX_TO_BUILDER专用令牌合同"
    - "角色切换必须包含task_id、authorized_files、independent_inspector"
    - "缺少任一字段时返回BLOCK—INVALID_ROLE_SWITCH"
  agents_md:
    - "将当前规则版本更新为1.1.0"
    - "删除‘只有任务单明确授权修复时，才可以修改相应文件’"
    - "明确Codex不得新增/修改/删除源码、测试、配置、依赖、部署或数据库状态"
    - "明确Codex可以只读检查、编制任务单/问题单、复跑不改变项目状态的验证、写监理报告"
    - "任何写工具调用前必须输出pre_action_role_check"
    - "changes_project_state=true且没有有效角色切换令牌时必须停止并转交扣子"
  task_template_yaml:
    - "新增role、mode、write_allowed字段"
    - "Codex模板默认role=inspector、mode=read_only、write_allowed=false"
    - "新增builder_must_not_equal_inspector=true"
    - "新增role_conflict_status=BLOCK—ROLE_CONFLICT"

role_switch_contract:
  token: ROLE_SWITCH_CODEX_TO_BUILDER
  required_fields:
    - task_id
    - authorized_files
    - independent_inspector
  invalid_status: BLOCK—INVALID_ROLE_SWITCH
  note: "普通自然语言和普通任务单授权均不得替代专用令牌。"

pre_action_role_check_contract:
  required_before:
    - apply_patch
    - file_create
    - file_modify
    - file_delete
    - dependency_install
    - deployment
    - database_mutation
  schema:
    current_role: codex-inspector
    requested_action: ""
    changes_project_state: true
    valid_role_switch: false
    permitted: false
    handoff_target: coze-builder

acceptance_criteria:
  - id: AC-01
    assertion: "AGENTS.md和GOVERNANCE.md不再包含任务单授权Codex修复的例外"
    severity_on_failure: BLOCK
  - id: AC-02
    assertion: "普通自然语言不得触发角色切换"
    severity_on_failure: BLOCK
  - id: AC-03
    assertion: "专用角色切换令牌必须包含三个必要字段"
    severity_on_failure: BLOCK
  - id: AC-04
    assertion: "builder等于inspector时门禁输出BLOCK—ROLE_CONFLICT"
    severity_on_failure: BLOCK
  - id: AC-05
    assertion: "同一主体自检不能标为独立验收"
    severity_on_failure: BLOCK
  - id: AC-06
    assertion: "TASK_TEMPLATE默认Codex只读且write_allowed=false"
    severity_on_failure: BLOCK
  - id: AC-07
    assertion: "本任务没有修改三个授权规则文件与证据目录之外的文件"
    severity_on_failure: BLOCK
  - id: AC-08
    assertion: "文档明确仓库规则不能替代宿主文件系统只读权限"
    severity_on_failure: BLOCK

external_enforcement_requirement:
  status: REQUIRED_OUTSIDE_REPOSITORY
  statement: >
    扣子必须在规则中明确：仓库内Markdown/YAML只能形成治理门禁，
    不能修改Codex Desktop宿主授予的workspace-write权限。
    若要技术上禁止Codex写src/tests/config，平台负责人必须在Codex任务/沙箱配置中
    将这些目录设置为只读，或使用独立只读副本进行监理。

evidence_directory: evidence/GOVERNANCE-003-CODEX-READONLY/
review_report: reviews/GOVERNANCE-003-CODEX-READONLY-review.md
release_allowed: false

approval:
  approved_by: "平台负责人（当前指令：进行修正）"
  approved_at: "2026-07-31"
  notes: "Codex仅编制合同，不直接修改治理规则。"
