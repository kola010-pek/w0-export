# DAG Configuration - Deterministic Production Pipeline
# Each node has strict dependency requirements.

dag:
  name: daily-production-pipeline
  description: "\u6BCF\u65E5\u751F\u4EA7\u6D41\u6C34\u7EBF - \u4ECE\u6570\u636E\u66F4\u65B0\u5230\u53D1\u5E03\u89C2\u5BDF"

  nodes:
    daily_kline:
      display_name: "\u65E5\u7EBF\u66F4\u65B0"
      agent: data-ops-agent
      task_type: data_update
      depends_on: []
      required_gates: []
      data_object: daily_kline
      description: "\u66F4\u65B0\u65E5\u7EBF\u884C\u60C5\u6570\u636E"

    adjustment_factors:
      display_name: "\u590D\u6743\u56E0\u5B50\u66F4\u65B0"
      agent: data-ops-agent
      task_type: data_update
      depends_on: [daily_kline]
      required_gates: []
      data_object: adjustment_factors
      description: "\u66F4\u65B0\u590D\u6743\u56E0\u5B50\u6570\u636E"

    factor_data:
      display_name: "\u57FA\u7840\u56E0\u5B50\u66F4\u65B0"
      agent: data-ops-agent
      task_type: data_update
      depends_on: [adjustment_factors]
      required_gates: []
      data_object: factor_data
      description: "\u66F4\u65B0\u57FA\u7840\u56E0\u5B50\u6570\u636E"

    market_factors:
      display_name: "\u5E02\u573A\u56E0\u5B50\u66F4\u65B0"
      agent: data-ops-agent
      task_type: data_update
      depends_on: [factor_data]
      required_gates: []
      data_object: market_factors
      description: "\u66F4\u65B0\u5E02\u573A\u56E0\u5B50\u6570\u636E"

    product_quality_gate:
      display_name: "\u6570\u636E\u8D28\u91CF\u95E8\u7981"
      agent: data-quality-agent
      task_type: quality_check
      depends_on: [market_factors]
      required_gates: []
      scope: database_core
      description: "\u68C0\u67E5\u6570\u636E\u8D28\u91CF\u662F\u5426\u8FBE\u6807"

    candidate_signal:
      display_name: "\u5019\u9009\u4FE1\u53F7\u751F\u6210"
      agent: model-production-agent
      task_type: model_run
      depends_on: [product_quality_gate]
      required_gates: [database_core]
      description: "\u57FA\u4E8E\u901A\u8FC7\u95E8\u7981\u7684\u6570\u636E\u751F\u6210\u5019\u9009\u4FE1\u53F7"

    risk_approval:
      display_name: "\u98CE\u63A7\u5BA1\u6279"
      agent: model-risk-agent
      task_type: risk_review
      depends_on: [candidate_signal]
      required_gates: [model]
      description: "\u72EC\u7ACB\u5BA1\u67E5\u6A21\u578B\u7ED3\u679C\u5E76\u8F93\u51FA\u5BA1\u6279\u610F\u89C1"

    release:
      display_name: "\u6B63\u5F0F\u53D1\u5E03"
      agent: release-observer-agent
      task_type: release
      depends_on: [risk_approval]
      required_gates: [model, approval]
      description: "\u53D1\u5E03\u5DF2\u5BA1\u6279\u7684\u6B63\u5F0F\u4FE1\u53F7"

    post_release_observation:
      display_name: "\u53D1\u5E03\u540E\u89C2\u5BDF"
      agent: release-observer-agent
      task_type: observation
      depends_on: [release]
      required_gates: []
      description: "\u76D1\u63A7\u53D1\u5E03\u540E\u72B6\u6001\u5E76\u89E6\u53D1\u544A\u8B66"
