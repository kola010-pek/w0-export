policy_version: "1.1.0"
task_id: W0-VERSION-ANCHORING-READONLY
builder: coze-builder
inspector: codex-inspector
environment: remote-github-read-only
data_source: https://github.com/kola010-pek/w0-export

role: inspector
mode: read_only
write_allowed: false
install_allowed: false
build_allowed: false
test_allowed: false
api_start_allowed: false
ui_check_allowed: false

version:
  source_commit_sha_full: 0cb21090e6e52b1514bfd5776d409a8c448c7983
  delivery_tag: w0-20260807-delivery-v3
  delivery_commit_resolution: github_tag_ref
  archive: W0_WORKSPACE_EXPORT_w0-20260730-0cb21090.tar.gz
  declared_sha256: b60182bbc0b5ae57138a8249b1a240b1a975f00a7980d0cffbdc54bb8a61bacb
  sha256_independent_verification: NOT_EXECUTED

acceptance_criteria:
  - tag 与 GitHub API 返回的 commit 一致
  - 所有必需文件在交付 commit 树中
  - 6 个交付 URL 返回 HTTP 200
  - 来源清单和证据文件内容正确
  - 独立 SHA-256 验证标记为 NOT_EXECUTED

negative_checks:
  - 不得将旧 delivery commit 作为当前有效锚点
  - 不得将 Coze 路径冒充 Windows 共享工作区
  - 不得将自检 SHA-256 冒充 Codex 独立验证
  - 不得自行宣布版本锚定已经 PASS

evidence_requirements:
  - git rev-parse w0-20260807-delivery-v3^{commit}
  - git show --no-patch --format=fuller w0-20260807-delivery-v3^{commit}
  - git ls-tree -r --name-only w0-20260807-delivery-v3^{commit}
  - GitHub Tag Ref API 原始响应
  - GitHub Commit API 原始响应
  - 6 个 URL 的实际 HTTP 状态

rollback_plan:
  - 如 tag 与 commit 不一致，删除 tag 并重新创建
  - 如文件内容错误，修正后重新提交
  - 如 URL 不可访问，重启服务并重新验证

stop_points:
  - tag 与 GitHub API 返回的 commit 不一致
  - 创建 tag 后又修改交付内容
  - 当前证据继续使用旧 delivery commit
  - 把 Coze 路径冒充 Windows 共享工作区
  - 任一交付 URL 非 HTTP 200
  - 将 Coze 自检 SHA-256 冒充 Codex 独立验证
  - 自行宣布版本锚定已经 PASS
